name: Python RV nuisance diagnostics
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - run: python -m unittest discover -s tests -p 'test_rv_noise_budget.py' -v
      - run: python research/rv_noise_budget.py
